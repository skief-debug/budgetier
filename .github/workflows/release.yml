name: Build & Release APK

on:
  push:
    tags:
      - 'v*'          # Trigger bei: git tag v2 && git push --tags

# ← DAS war das Problem: fehlende Permissions
permissions:
  contents: write

jobs:
  build:
    name: Build APK & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION_NAME="${TAG#v}"
          # versionCode = erste Zahl des Tags (v2.1 → 2)
          VERSION_CODE=$(echo "$VERSION_NAME" | cut -d. -f1)
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Update versionCode & versionName in build.gradle.kts
        run: |
          sed -i "s/versionCode = [0-9]*/versionCode = ${{ steps.version.outputs.VERSION_CODE }}/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"${{ steps.version.outputs.VERSION_NAME }}\"/" app/build.gradle.kts

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk BudgeTier-${{ steps.version.outputs.TAG }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "BudgeTier ${{ steps.version.outputs.VERSION_NAME }}"
          body: ${{ github.event.head_commit.message }}
          files: BudgeTier-${{ steps.version.outputs.TAG }}.apk
          draft: false
          prerelease: false
